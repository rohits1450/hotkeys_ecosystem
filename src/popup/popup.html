<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hotkey Ecosystem</title>
    <style>
      body {
        width: 320px;
        font: 13px/1.4 -apple-system, Segoe UI, sans-serif;
        margin: 0;
        padding: 12px;
        background: #1e1e1e;
        color: #f0f0f0;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 3px 0;
        border-bottom: 1px solid #333;
      }
      td.key {
        color: #8ab4f8;
        white-space: nowrap;
        padding-right: 8px;
        font-family: monospace;
      }
      #unbound-note {
        margin-top: 10px;
        font-size: 12px;
        color: #bbb;
      }
      a {
        color: #8ab4f8;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 6px;
        background: #3a3a3a;
        color: #f0f0f0;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Hotkey Ecosystem</h1>
    <table id="commands"></table>
    <p id="unbound-note"></p>
    <button id="open-shortcuts">Configure shortcuts</button>
    <button id="open-options">Options</button>
    <script src="popup.js"></script>
  </body>
</html>
